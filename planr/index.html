<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="description" content="Persoonlijke weekplanner" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Planr" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>Planr</title>

  <!-- Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        },
      },
      // Safelist alle dynamische kleurklassen zodat Tailwind CDN ze altijd genereert
      safelist: [
        'bg-blue-500','bg-green-500','bg-red-500','bg-yellow-400',
        'bg-purple-500','bg-orange-500','bg-pink-500','bg-gray-400',
        'border-blue-600','border-green-600','border-red-600','border-yellow-500',
        'border-purple-600','border-orange-600','border-pink-600','border-gray-500',
        'bg-blue-500/20','bg-green-500/20','bg-red-500/20','bg-yellow-400/20',
        'bg-purple-500/20','bg-orange-500/20','bg-pink-500/20','bg-gray-400/20',
        'text-gray-900',
      ],
    };
  </script>

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel standalone voor JSX zonder buildstap -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; background: #0f172a; color: #fff; }
    body { overscroll-behavior: none; margin: 0; }
    #root { height: 100%; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
    /* Verberg native time-input arrow in sommige browsers */
    input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; }
    /* Onboarding animaties */
    @keyframes obSlideIn  { from { transform:translateX(28px); opacity:0; } to { transform:translateX(0); opacity:1; } }
    @keyframes obArrow    { 0%,100% { transform:translateX(0); } 50% { transform:translateX(5px); } }
    @keyframes obPulse    { 0%,100% { transform:scale(1); } 50% { transform:scale(1.04); } }
    @keyframes obFadeUp   { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:translateY(0); } }
    .ob-slide-in { animation: obSlideIn 0.55s cubic-bezier(.22,.68,0,1.15) both; }
    .ob-arrow    { animation: obArrow   1s   ease-in-out infinite; }
    .ob-pulse    { animation: obPulse   2.4s ease-in-out infinite; }
    .ob-fade-up  { animation: obFadeUp  0.35s ease both; }
    /* Modal animatie */
    @keyframes modalIn { from { transform:scale(.96) translateY(8px); opacity:0; } to { transform:scale(1) translateY(0); opacity:1; } }
    .modal-in { animation: modalIn 0.2s cubic-bezier(.22,.68,0,1.2) both; }
    /* Nu-lijn pulse */
    @keyframes nuDotPulse { 0%,100% { box-shadow:0 0 0 0 rgba(239,68,68,.5); } 60% { box-shadow:0 0 0 5px rgba(239,68,68,0); } }
    .nu-dot-pulse { animation: nuDotPulse 2s ease-in-out infinite; }
    /* Lege staat */
    @keyframes leegFadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .leeg-fade { animation: leegFadeIn 0.45s 0.25s ease both; }
    /* Dag wissel animatie (mobiel) */
    @keyframes dagIn  { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:translateX(0); } }
    @keyframes dagInL { from { opacity:0; transform:translateX(-20px); } to { opacity:1; transform:translateX(0); } }
    .dag-in   { animation: dagIn  0.22s ease both; }
    .dag-in-l { animation: dagInL 0.22s ease both; }
  </style>
</head>
<body>
  <div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ═══════════════════════════════════════════════════════════════
//  CONSTANTEN
// ═══════════════════════════════════════════════════════════════

const START_UUR     = 6;
const EIND_UUR      = 23;
const PX_PER_UUR    = 64;
const PX_PER_MIN    = PX_PER_UUR / 60;
const TOTAAL_HOOGTE = (EIND_UUR - START_UUR) * PX_PER_UUR; // 1088px
const UUR_LABELS    = Array.from({ length: EIND_UUR - START_UUR + 1 }, (_, i) => START_UUR + i);
const KLEUREN       = ['blauw','groen','rood','geel','paars','oranje','roze','grijs'];
const DUUR_OPTIES   = [15, 30, 45, 60, 90, 120];

// Template-tijdlijn (compacte schaal)
const TPL_PX_PER_UUR = 48;
const TPL_PX_PER_MIN = TPL_PX_PER_UUR / 60;
const TPL_HOOGTE     = (EIND_UUR - START_UUR) * TPL_PX_PER_UUR; // 816px

// Mini-preview (zeer compact, voor kaartjes/modals)
const PREV_PX_PER_UUR = 3.5;
const PREV_PX_PER_MIN = PREV_PX_PER_UUR / 60;
const PREV_HOOGTE     = (EIND_UUR - START_UUR) * PREV_PX_PER_UUR; // ~60px

// Dagkaart-tijdlijn (Plan volgende week)
const KAART_PX_UUR = 24;
const KAART_PX_MIN = KAART_PX_UUR / 60;
const KAART_HOOGTE = (EIND_UUR - START_UUR) * KAART_PX_UUR; // 408px
function kaartTop(min) { return (min - START_UUR * 60) * KAART_PX_MIN; }

// ═══════════════════════════════════════════════════════════════
//  KLEUR CONFIG
// ═══════════════════════════════════════════════════════════════

const KLEUR_CONFIG = {
  blauw:  { bg:'bg-blue-500',   text:'text-white',     border:'border-blue-600',   light:'bg-blue-500/20',   dot:'bg-blue-500'   },
  groen:  { bg:'bg-green-500',  text:'text-white',     border:'border-green-600',  light:'bg-green-500/20',  dot:'bg-green-500'  },
  rood:   { bg:'bg-red-500',    text:'text-white',     border:'border-red-600',    light:'bg-red-500/20',    dot:'bg-red-500'    },
  geel:   { bg:'bg-yellow-400', text:'text-gray-900',  border:'border-yellow-500', light:'bg-yellow-400/20', dot:'bg-yellow-400' },
  paars:  { bg:'bg-purple-500', text:'text-white',     border:'border-purple-600', light:'bg-purple-500/20', dot:'bg-purple-500' },
  oranje: { bg:'bg-orange-500', text:'text-white',     border:'border-orange-600', light:'bg-orange-500/20', dot:'bg-orange-500' },
  roze:   { bg:'bg-pink-500',   text:'text-white',     border:'border-pink-600',   light:'bg-pink-500/20',   dot:'bg-pink-500'   },
  grijs:  { bg:'bg-gray-400',   text:'text-white',     border:'border-gray-500',   light:'bg-gray-400/20',   dot:'bg-gray-400'   },
};

// ═══════════════════════════════════════════════════════════════
//  TIJD UTILITIES
// ═══════════════════════════════════════════════════════════════

function minutenNaarTop(min)           { return (min - START_UUR * 60) * PX_PER_MIN; }
function duurNaarHoogte(dur)           { return dur * PX_PER_MIN; }
function topNaarMinuten(top)           { return Math.round(((top / PX_PER_MIN) + START_UUR * 60) / 15) * 15; }
function minutenNaarTijdString(min)    { return `${String(Math.floor(min/60)).padStart(2,'0')}:${String(min%60).padStart(2,'0')}`; }
function tijdStringNaarMinuten(s)      { const [h,m] = s.split(':').map(Number); return h*60+m; }
function clampMinuten(min, dur = 60)   { return Math.max(START_UUR*60, Math.min(EIND_UUR*60 - dur, min)); }
function duurLabel(d)                  { return d < 60 ? `${d} min` : d === 60 ? '1 uur' : `${d/60} uur`; }
function tplTop(min)                   { return (min - START_UUR*60) * TPL_PX_PER_MIN; }
function tplHoogte(dur)                { return Math.max(dur * TPL_PX_PER_MIN, 14); }
function tplYNaarMin(top)              { return Math.round(((top / TPL_PX_PER_MIN) + START_UUR*60) / 15) * 15; }

// ═══════════════════════════════════════════════════════════════
//  WEEK UTILITIES
// ═══════════════════════════════════════════════════════════════

const DAGEN_KORT = ['Ma','Di','Wo','Do','Vr','Za','Zo'];
const MAANDEN    = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];

function getMaandag(d) {
  const r = new Date(d);
  const dag = r.getDay();
  r.setDate(r.getDate() + (dag === 0 ? -6 : 1 - dag));
  r.setHours(0,0,0,0);
  return r;
}
function getWeekDagen(ma) {
  return Array.from({length:7}, (_,i) => { const d = new Date(ma); d.setDate(d.getDate()+i); return d; });
}
function datumNaarString(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dagNaamKort(d)  { const n = d.getDay(); return DAGEN_KORT[n===0?6:n-1]; }
function dagNummer(d)    { return d.getDate(); }
function isVandaag(d)    { return datumNaarString(d) === datumNaarString(new Date()); }
function voegDagenToe(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function weeknummer(d) {
  const u = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dn = u.getUTCDay() || 7;
  u.setUTCDate(u.getUTCDate() + 4 - dn);
  const ys = new Date(Date.UTC(u.getUTCFullYear(),0,1));
  return Math.ceil((((u-ys)/86400000)+1)/7);
}
function weekLabel(ma) {
  const zo = new Date(ma); zo.setDate(zo.getDate()+6);
  return `${ma.getDate()} ${MAANDEN[ma.getMonth()]} – ${zo.getDate()} ${MAANDEN[zo.getMonth()]} ${zo.getFullYear()}`;
}

// ═══════════════════════════════════════════════════════════════
//  LOCAL STORAGE
// ═══════════════════════════════════════════════════════════════

function load(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}
function genId() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }

// ═══════════════════════════════════════════════════════════════
//  STORE HOOK
// ═══════════════════════════════════════════════════════════════

function usePlanrStore() {
  const [activiteiten, setActiviteiten] = useState(() => load('planr_activiteiten', []));
  const [afspraken,    setAfspraken]    = useState(() => load('planr_afspraken', []));
  const [templates,    setTemplates]    = useState(() => load('planr_templates', []));

  useEffect(() => save('planr_activiteiten', activiteiten), [activiteiten]);
  useEffect(() => save('planr_afspraken',    afspraken),    [afspraken]);
  useEffect(() => save('planr_templates',    templates),    [templates]);

  const addActiviteit    = useCallback(d => setActiviteiten(p => [...p, {...d, id:genId()}]), []);
  const removeActiviteit = useCallback(id => setActiviteiten(p => p.filter(a => a.id!==id)), []);
  const addAfspraak      = useCallback(d => setAfspraken(p => [...p, {...d, id:genId()}]), []);
  const updateAfspraak   = useCallback((id,u) => setAfspraken(p => p.map(a => a.id===id?{...a,...u}:a)), []);
  const removeAfspraak   = useCallback(id => setAfspraken(p => p.filter(a => a.id!==id)), []);
  const addTemplate      = useCallback(d => setTemplates(p => [...p, {...d, id:genId()}]), []);
  const updateTemplate   = useCallback((id,u) => setTemplates(p => p.map(t => t.id===id?{...t,...u}:t)), []);
  const removeTemplate   = useCallback(id => setTemplates(p => p.filter(t => t.id!==id)), []);

  return { activiteiten, afspraken, templates, addActiviteit, removeActiviteit, addAfspraak, updateAfspraak, removeAfspraak, addTemplate, updateTemplate, removeTemplate };
}

// ═══════════════════════════════════════════════════════════════
//  MODAL OVERLAY
// ═══════════════════════════════════════════════════════════════

function ModalOverlay({ onSluit, children }) {
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={onSluit}>
      <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" />
      <div className="relative z-10 w-full sm:max-w-sm bg-slate-800 rounded-t-2xl sm:rounded-2xl shadow-2xl border border-slate-700 modal-in"
           onClick={e => e.stopPropagation()}>
        {children}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  NIEUWE ACTIVITEIT MODAL
// ═══════════════════════════════════════════════════════════════

function NieuweActiviteitModal({ onOpslaan, onSluit }) {
  const [naam, setNaam]               = useState('');
  const [kleur, setKleur]             = useState('blauw');
  const [duurMinuten, setDuurMinuten] = useState(60);

  function opslaan() {
    if (!naam.trim()) return;
    onOpslaan({ naam: naam.trim(), kleur, duurMinuten });
    onSluit();
  }

  return (
    <ModalOverlay onSluit={onSluit}>
      <div className="p-5 space-y-4">
        <div className="flex items-center justify-between">
          <h2 className="text-base font-semibold">Nieuwe activiteit</h2>
          <button onClick={onSluit} className="text-slate-500 hover:text-white text-xl leading-none">×</button>
        </div>

        <div>
          <label className="text-xs text-slate-400 block mb-1">Naam</label>
          <input autoFocus type="text" value={naam} onChange={e=>setNaam(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&opslaan()}
            placeholder="bijv. Sport, Werk, Studie…"
            className="w-full bg-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500 placeholder:text-slate-500" />
        </div>

        <div>
          <label className="text-xs text-slate-400 block mb-2">Kleur</label>
          <div className="flex gap-2 flex-wrap">
            {KLEUREN.map(k => (
              <button key={k} onClick={()=>setKleur(k)} title={k}
                className={`w-7 h-7 rounded-full transition-all ${KLEUR_CONFIG[k].bg} ${kleur===k?'ring-2 ring-white ring-offset-2 ring-offset-slate-800 scale-110':'hover:scale-105'}`} />
            ))}
          </div>
        </div>

        <div>
          <label className="text-xs text-slate-400 block mb-2">Duur</label>
          <div className="flex gap-2 flex-wrap">
            {DUUR_OPTIES.map(d => (
              <button key={d} onClick={()=>setDuurMinuten(d)}
                className={`px-3 py-1 rounded-lg text-xs font-medium transition-colors ${duurMinuten===d?'bg-indigo-600 text-white':'bg-slate-700 text-slate-400 hover:bg-slate-600'}`}>
                {duurLabel(d)}
              </button>
            ))}
          </div>
          <div className="mt-2 flex items-center gap-2">
            <input type="number" min={15} max={480} step={15} value={duurMinuten}
              onChange={e=>setDuurMinuten(Math.max(15,Math.min(480,Number(e.target.value))))}
              className="w-20 bg-slate-700 text-white text-xs rounded-lg px-2 py-1.5 outline-none focus:ring-2 focus:ring-indigo-500" />
            <span className="text-xs text-slate-500">minuten (vrij)</span>
          </div>
        </div>

        <div className="flex gap-2 pt-1">
          <button onClick={onSluit} className="flex-1 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-sm font-medium transition-colors">Annuleer</button>
          <button onClick={opslaan} disabled={!naam.trim()}
            className="flex-1 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed rounded-xl text-sm font-medium transition-colors">
            Opslaan
          </button>
        </div>
      </div>
    </ModalOverlay>
  );
}

// ═══════════════════════════════════════════════════════════════
//  NIEUWE AFSPRAAK MODAL
// ═══════════════════════════════════════════════════════════════

function NieuweAfspraakModal({ datum, startMinuten, onOpslaan, onSluit }) {
  const [naam, setNaam]   = useState('');
  const [kleur, setKleur] = useState('blauw');
  const [duur, setDuur]   = useState(60);
  const [start, setStart] = useState(startMinuten);

  function opslaan() {
    if (!naam.trim()) return;
    onOpslaan({ naam:naam.trim(), kleur, datum, startMinuten:clampMinuten(start,duur), duurMinuten:duur });
    onSluit();
  }

  const [jr,mn,dg] = datum.split('-').map(Number);

  return (
    <ModalOverlay onSluit={onSluit}>
      <div className="p-5 space-y-4">
        <div className="flex items-center justify-between">
          <h2 className="text-base font-semibold">Nieuwe afspraak</h2>
          <button onClick={onSluit} className="text-slate-500 hover:text-white text-xl leading-none">×</button>
        </div>
        <p className="text-xs text-slate-500 -mt-2">📅 {dg}/{mn}/{jr}</p>

        <div>
          <label className="text-xs text-slate-400 block mb-1">Naam</label>
          <input autoFocus type="text" value={naam} onChange={e=>setNaam(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&opslaan()}
            placeholder="bijv. Meeting, Lunch, Gym…"
            className="w-full bg-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500 placeholder:text-slate-500" />
        </div>

        <div className="flex gap-3">
          <div className="flex-1">
            <label className="text-xs text-slate-400 block mb-1">Starttijd</label>
            <input type="time" value={minutenNaarTijdString(start)} onChange={e=>setStart(tijdStringNaarMinuten(e.target.value))}
              className="w-full bg-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div className="flex-1">
            <label className="text-xs text-slate-400 block mb-1">Duur</label>
            <select value={duur} onChange={e=>setDuur(Number(e.target.value))}
              className="w-full bg-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
              {DUUR_OPTIES.map(d => <option key={d} value={d}>{duurLabel(d)}</option>)}
            </select>
          </div>
        </div>

        <div>
          <label className="text-xs text-slate-400 block mb-2">Kleur</label>
          <div className="flex gap-2 flex-wrap">
            {KLEUREN.map(k => (
              <button key={k} onClick={()=>setKleur(k)} title={k}
                className={`w-7 h-7 rounded-full transition-all ${KLEUR_CONFIG[k].bg} ${kleur===k?'ring-2 ring-white ring-offset-2 ring-offset-slate-800 scale-110':'hover:scale-105'}`} />
            ))}
          </div>
        </div>

        <div className="flex gap-2 pt-1">
          <button onClick={onSluit} className="flex-1 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-sm font-medium transition-colors">Annuleer</button>
          <button onClick={opslaan} disabled={!naam.trim()}
            className="flex-1 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed rounded-xl text-sm font-medium transition-colors">
            Opslaan
          </button>
        </div>
      </div>
    </ModalOverlay>
  );
}

// ═══════════════════════════════════════════════════════════════
//  AFSPRAAK OPTIES MODAL
// ═══════════════════════════════════════════════════════════════

function AfspraakOptiesModal({ afspraak, onVerwijder, onVerplaats, onSluit }) {
  const [toonVerplaats, setToonVerplaats] = useState(false);
  const [nieuweTijd, setNieuweTijd]       = useState(minutenNaarTijdString(afspraak.startMinuten));
  const cfg = KLEUR_CONFIG[afspraak.kleur];

  function verplaats() {
    onVerplaats?.(clampMinuten(tijdStringNaarMinuten(nieuweTijd), afspraak.duurMinuten));
    onSluit();
  }

  const [jr,mn,dg] = afspraak.datum.split('-').map(Number);

  return (
    <ModalOverlay onSluit={onSluit}>
      <div className="p-5 space-y-4">
        <div className={`flex items-start gap-3 p-3 rounded-xl ${cfg.light}`}>
          <div className={`w-3 h-3 rounded-full mt-0.5 flex-shrink-0 ${cfg.dot}`} />
          <div>
            <p className="text-sm font-semibold">{afspraak.naam}</p>
            <p className="text-xs text-slate-400 mt-0.5">
              {dg}/{mn}/{jr} · {minutenNaarTijdString(afspraak.startMinuten)} – {minutenNaarTijdString(afspraak.startMinuten+afspraak.duurMinuten)}
            </p>
          </div>
        </div>

        {!toonVerplaats ? (
          <div className="space-y-2">
            {onVerplaats && (
              <button onClick={()=>setToonVerplaats(true)}
                className="w-full py-2.5 bg-slate-700 hover:bg-slate-600 rounded-xl text-sm font-medium transition-colors text-left px-4">
                ✏️ Verplaatsen
              </button>
            )}
            <button onClick={onVerwijder}
              className="w-full py-2.5 bg-red-500/20 hover:bg-red-500/30 text-red-400 rounded-xl text-sm font-medium transition-colors">
              🗑️ Verwijderen
            </button>
            <button onClick={onSluit}

            <div>
              <label className="text-xs text-slate-400 block mb-1">Nieuwe starttijd</label>
              <input type="time" value={nieuweTijd} onChange={e=>setNieuweTijd(e.target.value)}
                className="w-full bg-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <div className="flex gap-2">
              <button onClick={()=>setToonVerplaats(false)} className="flex-1 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-sm font-medium transition-colors">Terug</button>
              <button onClick={verplaats} className="flex-1 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-xl text-sm font-medium transition-colors">Verplaatsen</button>
            </div>
          </div>
        )}
      </div>
    </ModalOverlay>
  );
}

// ═══════════════════════════════════════════════════════════════
//  AFSPRAAK BLOK
// ═══════════════════════════════════════════════════════════════

function AfspraakBlok({ afspraak, onClick, onDragStart, overlapt }) {
  const top     = minutenNaarTop(afspraak.startMinuten);
  const hoogte  = Math.max(duurNaarHoogte(afspraak.duurMinuten), 18);
  const cfg     = KLEUR_CONFIG[afspraak.kleur];
  const compact = hoogte < 36;
  const [sleept, setSleept] = useState(false);

  return (
    <div
      data-afspraak={afspraak.id}
      draggable={!!onDragStart}
      onClick={e=>{ e.stopPropagation(); onClick(); }}
      onDragStart={e=>{ e.stopPropagation(); setSleept(true); onDragStart?.(afspraak.id); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',afspraak.id); }}
      onDragEnd={()=>setSleept(false)}
      className={`absolute left-0.5 right-0.5 rounded ${cfg.bg} ${cfg.text} cursor-pointer select-none overflow-hidden z-10 border-l-2 ${cfg.border} shadow-sm hover:brightness-110 transition-all active:scale-95 ${sleept?'opacity-40 scale-95':''}${overlapt?' ring-1 ring-red-400/80':''}`}
      style={{ top, height: hoogte }}
    >
      {compact ? (
        <p className="text-[10px] font-medium px-1 truncate leading-[18px]">{afspraak.naam}</p>
      ) : (
        <div className="px-1.5 py-0.5">
          <p className="text-xs font-semibold truncate leading-tight">{afspraak.naam}</p>
          <p className="text-[10px] opacity-80 leading-tight">
            {minutenNaarTijdString(afspraak.startMinuten)} – {minutenNaarTijdString(afspraak.startMinuten+afspraak.duurMinuten)}
          </p>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  DAG KOLOM
// ═══════════════════════════════════════════════════════════════

function DagKolom({ datum, vandaag, afspraken, onSlotKlik, onAfspraakKlik, onDrop, onAfspraakDragStart, leegLabel, overlapIds }) {
  const ref = useRef(null);

  function yNaarMinuten(clientY) {
    const y = clientY - ref.current.getBoundingClientRect().top;
    return clampMinuten(topNaarMinuten(y), 30);
  }

  const nu        = new Date();
  const nuMin     = nu.getHours()*60 + nu.getMinutes();
  const toonNuLijn = vandaag && nuMin >= START_UUR*60 && nuMin <= EIND_UUR*60;

  return (
    <div
      ref={ref}
      className={`flex-1 relative border-l border-slate-700/60 cursor-pointer min-w-0 ${vandaag ? 'bg-indigo-950/20' : ''}`}
      style={{ height: TOTAAL_HOOGTE }}
      onClick={e=>{ if(e.target.closest('[data-afspraak]')) return; onSlotKlik(datum, yNaarMinuten(e.clientY)); }}
      onDragOver={e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; }}
      onDrop={e=>{ e.preventDefault(); onDrop?.(datum, yNaarMinuten(e.clientY)); }}
    >
      {/* Uurlijnen */}
      {UUR_LABELS.map(u => (
        <div key={u} className="absolute left-0 right-0 border-t border-slate-700/60 pointer-events-none" style={{top:(u-START_UUR)*PX_PER_UUR}} />
      ))}
      {/* Kwartierlijnen */}
      {UUR_LABELS.slice(0,-1).map(u => [1,2,3].map(k => (
        <div key={`${u}-${k}`} className="absolute left-0 right-0 border-t border-slate-800/60 pointer-events-none" style={{top:(u-START_UUR)*PX_PER_UUR + k*16}} />
      )))}
      {/* Nu-lijn */}
      {toonNuLijn && (
        <div className="absolute left-0 right-0 z-20 pointer-events-none" style={{top:minutenNaarTop(nuMin)}}>
          <div className="absolute -left-1 w-2.5 h-2.5 bg-red-500 rounded-full -translate-y-1/2 nu-dot-pulse" />
          <div className="border-t-2 border-red-500" />
        </div>
      )}
      {/* Lege staat */}
      {afspraken.length === 0 && leegLabel && (
        <div className="absolute inset-0 flex items-center justify-center pointer-events-none leeg-fade">
          <p className="text-[10px] text-slate-700 text-center leading-relaxed px-2">{leegLabel}</p>
        </div>
      )}
      {/* Afspraken */}
      {afspraken.map(a => (
        <AfspraakBlok key={a.id} afspraak={a} onClick={()=>onAfspraakKlik(a)} onDragStart={onAfspraakDragStart} overlapt={overlapIds?.has(a.id)} />
      ))}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  WEEK KALENDER (desktop)
// ═══════════════════════════════════════════════════════════════

function WeekKalender({ maandag, afspraken, onSlotKlik, onAfspraakKlik, onDrop, onAfspraakDragStart, onDagHeaderKlik }) {
  const dagen = getWeekDagen(maandag);
  const overlapIds = new Set();
  afspraken.forEach(a => {
    if (afspraken.some(b => b.id !== a.id && b.datum === a.datum &&
      b.startMinuten < a.startMinuten + a.duurMinuten &&
      b.startMinuten + b.duurMinuten > a.startMinuten)) {
      overlapIds.add(a.id);
    }
  });
  return (
    <div className="flex-1 overflow-hidden flex flex-col min-h-0">
      {/* Dag-headers */}
      <div className="flex flex-shrink-0 border-b border-slate-700 bg-slate-900">
        <div className="w-12 flex-shrink-0" />
        {dagen.map(dag => {
          const vd = isVandaag(dag);
          const ds = datumNaarString(dag);
          return (
            <div key={dag.toISOString()}
              onClick={()=>onDagHeaderKlik?.(ds)}
              title={onDagHeaderKlik ? 'Template toepassen op deze dag' : undefined}
              className={`flex-1 py-2 text-center border-l border-slate-700/60 min-w-0 ${onDagHeaderKlik?'cursor-pointer hover:bg-slate-800/70 transition-colors group':''}`}>
              <div className={`text-xs font-medium ${vd?'text-indigo-400':'text-slate-500'}`}>{dagNaamKort(dag)}</div>
              <div className={`text-sm font-bold mx-auto mt-0.5 w-7 h-7 flex items-center justify-center rounded-full ${vd?'bg-indigo-600 text-white':'text-slate-300'}`}>
                {dagNummer(dag)}
              </div>
              {onDagHeaderKlik && <div className="text-[8px] text-slate-700 group-hover:text-slate-500 transition-colors mt-0.5">🗂️</div>}
            </div>
          );
        })}
      </div>
      {/* Scrollbaar lichaam */}
      <div className="flex-1 overflow-y-auto">
        <div className="flex" style={{height:TOTAAL_HOOGTE}}>
          {/* Tijdas */}
          <div className="w-12 flex-shrink-0 relative select-none">
            {UUR_LABELS.map(u => (
              <div key={u} className="absolute right-2 text-[10px] text-slate-600 tabular-nums" style={{top:(u-START_UUR)*PX_PER_UUR-7}}>
                {u}:00
              </div>
            ))}
          </div>
          {/* Dag-kolommen */}
          {dagen.map(dag => {
            const ds = datumNaarString(dag);
            return (
              <DagKolom
                key={ds} datum={ds} vandaag={isVandaag(dag)}
                afspraken={afspraken.filter(a=>a.datum===ds)}
                onSlotKlik={onSlotKlik} onAfspraakKlik={onAfspraakKlik}
                onDrop={onDrop} onAfspraakDragStart={onAfspraakDragStart}
                leegLabel="Sleep een activiteit hierheen"
                overlapIds={overlapIds}
              />
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  MOBIELE KALENDER
// ═══════════════════════════════════════════════════════════════

function MobieleKalender({ dag, afspraken, pendingActiviteit, onSlotKlik, onAfspraakKlik, onVorigeDag, onVolgendeDag }) {
  const touchX       = useRef(0);
  const touchY       = useRef(0);
  const swipeRichting = useRef('');
  const datum  = datumNaarString(dag);
  const cfg    = pendingActiviteit ? KLEUR_CONFIG[pendingActiviteit.kleur] : null;
  const animClass = swipeRichting.current === 'terug' ? 'dag-in-l' : swipeRichting.current === 'voor' ? 'dag-in' : '';

  function navigeerVolgende() { swipeRichting.current = 'voor';  onVolgendeDag(); }
  function navigeerVorige()   { swipeRichting.current = 'terug'; onVorigeDag(); }

  return (
    <div className="flex flex-col h-full overflow-hidden">
      {pendingActiviteit && (
        <div className={`flex-shrink-0 flex items-center gap-2 px-4 py-2.5 text-sm font-medium ${cfg.bg} ${cfg.text}`}>
          <span>Tik op een tijdslot om</span>
          <span className="font-bold">{pendingActiviteit.naam}</span>
          <span>in te plannen</span>
        </div>
      )}
      <div className="flex-1 overflow-y-auto overflow-x-hidden"
        onTouchStart={e=>{ touchX.current=e.touches[0].clientX; touchY.current=e.touches[0].clientY; }}
        onTouchEnd={e=>{
          const dx = e.changedTouches[0].clientX - touchX.current;
          const dy = Math.abs(e.changedTouches[0].clientY - touchY.current);
          if (Math.abs(dx)>50 && Math.abs(dx)>dy) { dx<0 ? navigeerVolgende() : navigeerVorige(); }
        }}
      >
        <div key={datum} className={`flex ${animClass}`} style={{height:TOTAAL_HOOGTE}}>
          <div className="w-12 flex-shrink-0 relative select-none">
            {UUR_LABELS.map(u => (
              <div key={u} className="absolute right-2 text-[10px] text-slate-600 tabular-nums" style={{top:(u-START_UUR)*PX_PER_UUR-7}}>
                {u}:00
              </div>
            ))}
          </div>
          <DagKolom
            datum={datum} vandaag={isVandaag(dag)} afspraken={afspraken}
            onSlotKlik={onSlotKlik} onAfspraakKlik={onAfspraakKlik}
            leegLabel={!pendingActiviteit ? "Tik op een activiteit om te beginnen" : undefined}
          />
        </div>
      </div>
    </div>
  );
}

function NieuwTemplateModal({ onOpslaan, onSluit }) {
  const [naam, setNaam] = useState('');
  function opslaan() {
    if (!naam.trim()) return;
    onOpslaan({ naam: naam.trim(), blokken: [] });

            className="w-full bg-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500 placeholder:text-slate-500" />

// ─── Mini-preview (kleurstrepen per dag) ───────────────────────
function TemplateMiniPreview({ blokken, breedte = 20, pxPerUur = PREV_PX_PER_UUR }) {
  const pxPerMin = pxPerUur / 60;
  const hoogte   = (EIND_UUR - START_UUR) * pxPerUur;
  return (
    <div className="relative flex-shrink-0 bg-slate-900 rounded overflow-hidden border border-slate-700/60"
         style={{ width: breedte, height: hoogte }}>
      {blokken.map((b, i) => {
        const top = (b.startMinuten - START_UUR*60) * pxPerMin;
        const h   = Math.max(b.duurMinuten * pxPerMin, 2);
        return <div key={i} className={`absolute inset-x-0 ${KLEUR_CONFIG[b.kleur].bg}`} style={{ top, height: h }} />;
      })}
    </div>
  );
}

// ─── Template-editor met tijdlijn ──────────────────────────────
function TemplateEditor({ template, activiteiten, onBijwerken, onTerug }) {
  const [toontLosBlok, setToontLosBlok] = useState(false);
  const [pendingAct,   setPendingAct]   = useState(null);   // mobiel tap-modus
  const [gesBlokIdx,   setGesBlokIdx]   = useState(null);   // geselecteerde blok
  const [dragActId,    setDragActId]    = useState(null);
  const [dragOver,     setDragOver]     = useState(false);
  const tijdlijnRef = useRef(null);

  function yNaarMin(clientY) {
    const rect = tijdlijnRef.current.getBoundingClientRect();
    return clampMinuten(tplYNaarMin(clientY - rect.top), 30);
  }

  function voegActToe(act, startMin) {
    onBijwerken({ blokken: [...template.blokken, {
      naam: act.naam, kleur: act.kleur,
      startMinuten: clampMinuten(startMin, act.duurMinuten),
      duurMinuten: act.duurMinuten,
    }]});
  }

  function verwijderBlok(idx) {
    const b = [...template.blokken]; b.splice(idx, 1);
    onBijwerken({ blokken: b });
    setGesBlokIdx(null);
  }

  function handleDrop(e) {
    e.preventDefault(); setDragOver(false);
    if (!dragActId) return;
    const act = activiteiten.find(a => a.id === dragActId);
    if (act) voegActToe(act, yNaarMin(e.clientY));
    setDragActId(null);
  }

  function handleTijdlijnKlik(e) {
    if (e.target.closest('[data-tblok]')) return;
    if (!pendingAct) { setGesBlokIdx(null); return; }
    voegActToe(pendingAct, yNaarMin(e.clientY));
    setPendingAct(null);
  }

  return (
    <div className="h-screen bg-slate-900 text-white flex flex-col overflow-hidden">
      {/* Header */}
      <div className="flex items-center gap-2 px-3 py-3 border-b border-slate-700 flex-shrink-0">
        <button onClick={onTerug} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-700 text-slate-400 hover:text-white text-xl">‹</button>
        <h1 className="text-sm font-semibold flex-1 truncate">{template.naam}</h1>
        <button onClick={()=>setToontLosBlok(true)}
          className="text-xs px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg font-medium transition-colors">
          + Losse blok
        </button>
      </div>

      {/* Activiteiten chips */}
      {activiteiten.length > 0 && (
        <div className="flex-shrink-0 border-b border-slate-700">
          {pendingAct && (
            <div className={`px-3 py-1.5 text-xs font-medium ${KLEUR_CONFIG[pendingAct.kleur].bg} ${KLEUR_CONFIG[pendingAct.kleur].text}`}>
              Tik op de tijdlijn om <strong>{pendingAct.naam}</strong> te plaatsen
            </div>
          )}
          <div className="flex gap-2 px-3 py-2 overflow-x-auto">
            {activiteiten.map(act => {
              const cfg = KLEUR_CONFIG[act.kleur];
              const ip  = pendingAct?.id === act.id;
              return (
                <div key={act.id}
                  draggable
                  onDragStart={e=>{ setDragActId(act.id); e.dataTransfer.effectAllowed='copy'; e.dataTransfer.setData('text/plain',act.id); }}
                  onDragEnd={()=>setDragActId(null)}
                  onClick={()=>setPendingAct(prev=>prev?.id===act.id?null:act)}
                  className={`flex-shrink-0 flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg cursor-pointer select-none transition-all ${ip?`${cfg.bg} ${cfg.text} ring-2 ring-white`:'bg-slate-800 hover:bg-slate-700 text-slate-300'}`}
                >
                  <div className={`w-2 h-2 rounded-full flex-shrink-0 ${cfg.dot}`} />
                  <span className="text-xs font-medium whitespace-nowrap">{act.naam}</span>
                  <span className={`text-[10px] ${ip?'opacity-70':'text-slate-500'}`}>{act.duurMinuten}m</span>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Tijdlijn */}
      <div className="flex-1 overflow-y-auto">
        <div className="flex" style={{ height: TPL_HOOGTE }}>
          {/* Tijdas */}
          <div className="w-11 flex-shrink-0 relative select-none bg-slate-900/80">
            {UUR_LABELS.map(u => (
              <div key={u} className="absolute right-1.5 text-[9px] text-slate-600 tabular-nums"
                   style={{ top: (u - START_UUR) * TPL_PX_PER_UUR - 6 }}>
                {u}:00
              </div>
            ))}
          </div>
          {/* Tijdlijn-kolom */}
          <div
            ref={tijdlijnRef}
            className={`flex-1 relative border-l border-slate-700 transition-colors ${dragOver?'bg-indigo-900/20':''} ${pendingAct?'cursor-crosshair':''}`}
            style={{ height: TPL_HOOGTE }}
            onClick={handleTijdlijnKlik}
            onDragOver={e=>{ e.preventDefault(); setDragOver(true); e.dataTransfer.dropEffect='copy'; }}
            onDragLeave={()=>setDragOver(false)}
            onDrop={handleDrop}
          >
            {UUR_LABELS.map(u => (
              <div key={u} className="absolute left-0 right-0 border-t border-slate-700/60 pointer-events-none"
                   style={{ top: (u - START_UUR) * TPL_PX_PER_UUR }} />
            ))}
            {UUR_LABELS.slice(0,-1).map(u => (
              <div key={u} className="absolute left-0 right-0 border-t border-slate-800/50 pointer-events-none"
                   style={{ top: (u - START_UUR) * TPL_PX_PER_UUR + TPL_PX_PER_UUR/2 }} />
            ))}

            {template.blokken.map((blok, i) => {
              const cfg    = KLEUR_CONFIG[blok.kleur];
              const h      = tplHoogte(blok.duurMinuten);
              const compact = h < 28;
              const isGes  = gesBlokIdx === i;
              return (
                <div key={i}
                  data-tblok
                  onClick={e=>{ e.stopPropagation(); setGesBlokIdx(isGes?null:i); setPendingAct(null); }}
                  className={`absolute left-0.5 right-0.5 rounded ${cfg.bg} ${cfg.text} cursor-pointer select-none overflow-hidden z-10 border-l-2 ${cfg.border} shadow-sm hover:brightness-110 transition-all ${isGes?'ring-2 ring-white':''}`}
                  style={{ top: tplTop(blok.startMinuten), height: h }}
                >
                  {compact ? (
                    <div className="flex items-center justify-between px-1 h-full gap-1">
                      <p className="text-[9px] font-semibold truncate">{blok.naam}</p>
                      {isGes && <button onClick={e=>{e.stopPropagation();verwijderBlok(i);}} className="text-[10px] opacity-90 flex-shrink-0">×</button>}
                    </div>
                  ) : (
                    <div className="px-1.5 py-0.5 flex items-start justify-between gap-1">
                      <div className="min-w-0">
                        <p className="text-[10px] font-semibold truncate leading-tight">{blok.naam}</p>
                        <p className="text-[9px] opacity-75 leading-tight">{minutenNaarTijdString(blok.startMinuten)} · {duurLabel(blok.duurMinuten)}</p>
                      </div>
                      {isGes && <button onClick={e=>{e.stopPropagation();verwijderBlok(i);}} className="text-sm opacity-90 flex-shrink-0 leading-none mt-0.5">×</button>}
                    </div>
                  )}
                </div>
              );
            })}

            {template.blokken.length === 0 && (
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                <p className="text-xs text-slate-600 text-center px-8 leading-relaxed">
                  {activiteiten.length > 0 ? 'Sleep een activiteit hiernaartoe\nof tik op een chip en dan een tijdslot' : 'Gebruik "+ Losse blok" om tijdblokken toe te voegen'}
                </p>
              </div>
            )}
          </div>
        </div>
      </div>

      {toontLosBlok && (
        <NieuwBlokModal
          onOpslaan={blok=>{ onBijwerken({ blokken:[...template.blokken, blok] }); setToontLosBlok(false); }}
          onSluit={()=>setToontLosBlok(false)}
        />
      )}
    </div>
  );
}

// ─── Template toepassen op een dag ─────────────────────────────
function TemplateToepassenModal({ datum, templates, bestaandeAfspraken, onToepassen, onSluit }) {
  const [gesId, setGesId] = useState(templates.length === 1 ? templates[0].id : null);
  const [mode,  setMode]  = useState('aanvullen');
  const heeftBestaande    = bestaandeAfspraken.length > 0;
  const [jr,mn,dg]        = datum.split('-').map(Number);

  function toepassen() {
    if (!gesId) return;
    onToepassen({ template: templates.find(t=>t.id===gesId), datum, mode });
    onSluit();
  }

  return (
    <ModalOverlay onSluit={onSluit}>
      <div className="p-5 space-y-4 max-h-[85vh] overflow-y-auto">
        <div className="flex items-start justify-between">
          <div>
            <h2 className="text-base font-semibold">Dagtemplate toepassen</h2>
            <p className="text-xs text-slate-500 mt-0.5">{dg}/{mn}/{jr}</p>
          </div>
          <button onClick={onSluit} className="text-slate-500 hover:text-white text-xl leading-none">×</button>
        </div>

        {templates.length === 0 ? (
          <p className="text-xs text-slate-400 py-4 text-center">Nog geen templates.<br/>Maak eerst een template aan via het Templates-tabblad.</p>
        ) : (
          <div className="space-y-2">
            {templates.map(t => {
              const isGes = gesId === t.id;
              return (
                <div key={t.id} onClick={()=>setGesId(t.id)}
                  className={`flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-colors ${isGes?'bg-indigo-600':'bg-slate-700 hover:bg-slate-600'}`}>
                  <TemplateMiniPreview blokken={t.blokken} breedte={22} pxPerUur={4} />
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-semibold truncate">{t.naam}</p>
                    <p className={`text-xs mt-0.5 ${isGes?'text-indigo-200':'text-slate-400'}`}>{t.blokken.length} tijdblok{t.blokken.length!==1?'ken':''}</p>
                    <div className="flex flex-wrap gap-1 mt-1.5">
                      {[...t.blokken].sort((a,b)=>a.startMinuten-b.startMinuten).slice(0,3).map((b,i) => {
                        const cfg = KLEUR_CONFIG[b.kleur];
                        return (
                          <span key={i} className={`text-[9px] px-1.5 py-0.5 rounded-full font-medium ${isGes?'bg-white/20 text-white':`${cfg.bg} ${cfg.text}`}`}>
                            {minutenNaarTijdString(b.startMinuten)} {b.naam}
                          </span>
                        );
                      })}
                      {t.blokken.length > 3 && <span className={`text-[9px] ${isGes?'text-indigo-200':'text-slate-500'}`}>+{t.blokken.length-3}</span>}
                    </div>
                  </div>
                  <div className={`w-4 h-4 rounded-full border-2 flex-shrink-0 flex items-center justify-center transition-colors ${isGes?'border-white bg-white':'border-slate-500'}`}>
                    {isGes && <div className="w-2 h-2 rounded-full bg-indigo-600" />}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {heeftBestaande && gesId && (
          <div className="bg-slate-800 rounded-xl p-3 space-y-2">
            <p className="text-xs text-slate-400">Er zijn al <span className="text-white font-medium">{bestaandeAfspraken.length} afspraken</span> op deze dag</p>
            <div className="flex gap-2">
              <button onClick={()=>setMode('aanvullen')}
                className={`flex-1 py-2 text-xs font-medium rounded-lg transition-colors ${mode==='aanvullen'?'bg-indigo-600 text-white':'bg-slate-700 text-slate-400 hover:bg-slate-600'}`}>
                Aanvullen
              </button>
              <button onClick={()=>setMode('vervangen')}
                className={`flex-1 py-2 text-xs font-medium rounded-lg transition-colors ${mode==='vervangen'?'bg-red-500/80 text-white':'bg-slate-700 text-slate-400 hover:bg-slate-600'}`}>
                Vervangen
              </button>
            </div>
          </div>
        )}

        <div className="flex gap-2 pt-1">
          <button onClick={onSluit} className="flex-1 py-2.5 bg-slate-700 hover:bg-slate-600 rounded-xl text-sm font-medium transition-colors">Annuleer</button>
          <button onClick={toepassen} disabled={!gesId}
            className="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed rounded-xl text-sm font-medium transition-colors">
            Toepassen
          </button>
        </div>
      </div>
    </ModalOverlay>
  );
}

            <p className="text-slate-500 text-xs">Maak herbruikbare dagindelingen aan<br/>en gebruik ze bij het plannen van je week.</p>

                  <div className="mt-2 flex flex-wrap gap-1">
                    {[...t.blokken].sort((a,b)=>a.startMinuten-b.startMinuten).slice(0,4).map((b,i) => {
                      const cfg = KLEUR_CONFIG[b.kleur];
                      return (
                        <span key={i} className={`text-[9px] px-1.5 py-0.5 rounded-full font-medium ${cfg.bg} ${cfg.text}`}>
                          {minutenNaarTijdString(b.startMinuten)} {b.naam}

                      );

                    {t.blokken.length > 4 && <span className="text-[9px] text-slate-500">+{t.blokken.length-4}</span>}
                  </div>
                )}
              </div>
              <div className="flex gap-1.5 flex-shrink-0">

    <div className="relative select-none" style={{ height: KAART_HOOGTE }}>
      {UUR_LABELS.map(u => (
        <div key={u} className="absolute left-0 right-0 pointer-events-none" style={{ top: (u - START_UUR) * KAART_PX_UUR }}>
          <div className="border-t border-slate-700/50 absolute inset-x-0" />

            <span className="absolute left-0.5 text-[7px] text-slate-700 tabular-nums leading-none select-none" style={{ top: -5 }}>
              {u}u
            </span>
          )}
        </div>
      ))}

      {blokken.map(blok => {
        const cfg     = KLEUR_CONFIG[blok.kleur];
        const top     = kaartTop(blok.startMinuten);
        const h       = Math.max(blok.duurMinuten * KAART_PX_MIN, 10);
        const compact = h < 18;
        return (
          <div key={blok.id}
            className={`absolute right-0.5 rounded overflow-hidden ${cfg.bg} ${cfg.text} border-l-[2px] ${cfg.border} shadow-sm group cursor-default`}
            style={{ top, height: h, left: 22 }}
          >
            <div className={`flex items-center justify-between h-full ${compact ? 'px-0.5 gap-0' : 'px-1 gap-0.5'}`}>
              <p className={`truncate font-medium leading-none ${compact ? 'text-[7px]' : 'text-[9px]'}`}>{blok.naam}</p>
              <button
                onClick={() => onVerwijder(blok.id)}
                className={`flex-shrink-0 leading-none rounded-sm hover:bg-black/20 transition-all px-0.5 ${compact ? 'text-[8px] opacity-50 hover:opacity-100' : 'text-[10px] opacity-0 group-hover:opacity-80'}`}
              >×</button>
            </div>
          </div>
        );
      })}

      {blokken.length === 0 && (
        <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
          <p className="text-[9px] text-slate-700 text-center leading-relaxed">Geen blokken<br/>ingepland</p>
        </div>
      )}

}

// ── Modal: losse afspraak toevoegen ───────────────────────────
function LosBlokModal({ datum, onOpslaan, onSluit }) {
  const [naam, setNaam]   = useState('');
  const [kleur, setKleur] = useState('blauw');
  const [start, setStart] = useState(9 * 60);
  const [duur,  setDuur]  = useState(60);
  const [jr, mn, dg]      = datum.split('-').map(Number);

  function opslaan() {
    if (!naam.trim()) return;
    onOpslaan({ id: genId(), naam: naam.trim(), kleur, startMinuten: clampMinuten(start, duur), duurMinuten: duur });
    onSluit();
  }

  return (
    <ModalOverlay onSluit={onSluit}>
      <div className="p-5 space-y-4">
        <div className="flex items-start justify-between">
          <div>
            <h2 className="text-base font-semibold">Losse afspraak</h2>
            <p className="text-xs text-slate-500 mt-0.5">{dg}/{mn}/{jr}</p>
          </div>
          <button onClick={onSluit} className="text-slate-500 hover:text-white text-xl leading-none">×</button>
        </div>
        <div>
          <label className="text-xs text-slate-400 block mb-1">Naam</label>
          <input autoFocus type="text" value={naam} onChange={e=>setNaam(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&opslaan()}
            placeholder="bijv. Lunch, Vergadering…"
            className="w-full bg-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500 placeholder:text-slate-500" />
        </div>
        <div className="flex gap-3">
          <div className="flex-1">
            <label className="text-xs text-slate-400 block mb-1">Starttijd</label>
            <input type="time" value={minutenNaarTijdString(start)} onChange={e=>setStart(tijdStringNaarMinuten(e.target.value))}
              className="w-full bg-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
          <div className="flex-1">
            <label className="text-xs text-slate-400 block mb-1">Duur</label>
            <select value={duur} onChange={e=>setDuur(Number(e.target.value))}
              className="w-full bg-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
              {DUUR_OPTIES.map(d => <option key={d} value={d}>{duurLabel(d)}</option>)}
            </select>
          </div>
        </div>
        <div>
          <label className="text-xs text-slate-400 block mb-2">Kleur</label>
          <div className="flex gap-2 flex-wrap">
            {KLEUREN.map(k => (
              <button key={k} onClick={()=>setKleur(k)}
                className={`w-7 h-7 rounded-full transition-all ${KLEUR_CONFIG[k].bg} ${kleur===k?'ring-2 ring-white ring-offset-2 ring-offset-slate-800 scale-110':'hover:scale-105'}`} />
            ))}
          </div>
        </div>
        <div className="flex gap-2 pt-1">
          <button onClick={onSluit} className="flex-1 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-sm font-medium transition-colors">Annuleer</button>
          <button onClick={opslaan} disabled={!naam.trim()}
            className="flex-1 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed rounded-xl text-sm font-medium transition-colors">
            Toevoegen
          </button>
        </div>
      </div>
    </ModalOverlay>
  );
}

// ── Dagkaart ─────────────────────────────────────────────────
function DagKaart({ dag, blokken, templates, onBlokToevoegen, onVerwijderBlok, inklapbaar }) {
  const datum   = datumNaarString(dag);
  const vd      = isVandaag(dag);
  const [ingeklapt, setIngeklapt] = useState(false);
  const [toontLos,  setToontLos]  = useState(false);

  function kiesTemplate(tId) {
    if (!tId) return;
    const t = templates.find(t => t.id === tId);
    if (!t) return;
    t.blokken.forEach(b => onBlokToevoegen(datum, {
      id: genId(), naam: b.naam, kleur: b.kleur,
      startMinuten: b.startMinuten, duurMinuten: b.duurMinuten
    }));
  }

  return (
    <div className={`bg-slate-800 rounded-xl overflow-hidden flex flex-col border border-slate-700/40 ${inklapbaar ? '' : 'flex-1 min-w-0'}`}>
      {/* Header */}
      <div
        className={`flex items-center justify-between px-3 py-2.5 flex-shrink-0 border-b border-slate-700/60 ${inklapbaar ? 'cursor-pointer hover:bg-slate-700/40 active:bg-slate-700 transition-colors' : ''}`}
        onClick={inklapbaar ? () => setIngeklapt(p => !p) : undefined}
      >
        <div className="flex items-center gap-2">
          <div className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 ${vd ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-200'}`}>
            {dag.getDate()}
          </div>
          <div className="leading-tight">
            <p className={`text-xs font-bold ${vd ? 'text-indigo-400' : 'text-slate-200'}`}>{dagNaamKort(dag)}</p>
            <p className="text-[10px] text-slate-500">{MAANDEN[dag.getMonth()]}</p>
          </div>
        </div>
        <div className="flex items-center gap-1.5">
          {blokken.length > 0 && (
            <span className="text-[9px] font-semibold text-indigo-300 bg-indigo-900/50 px-1.5 py-0.5 rounded-full tabular-nums">{blokken.length}</span>
          )}
          {inklapbaar && (
            <span className={`text-slate-500 text-xs transition-transform duration-200 inline-block ${ingeklapt ? '' : 'rotate-90'}`}>›</span>
          )}
        </div>
      </div>

      {/* Body */}
      {!ingeklapt && (
        <div className="flex flex-col flex-1 min-h-0">
          {/* Acties */}
          <div className="px-2 py-2 space-y-1.5 flex-shrink-0">
            {templates.length > 0 && (
              <select
                defaultValue=""
                onChange={e => { kiesTemplate(e.target.value); e.target.value = ''; }}
                className="w-full bg-slate-700 hover:bg-slate-600 text-slate-300 text-[10px] rounded-lg px-2 py-1.5 outline-none focus:ring-1 focus:ring-indigo-500 cursor-pointer transition-colors"
              >
                <option value="" disabled>🗂️ Template toepassen…</option>
                {templates.map(t => (
                  <option key={t.id} value={t.id}>{t.naam}</option>
                ))}
              </select>
            )}
            <button
              onClick={() => setToontLos(true)}
              className="w-full text-left text-[10px] text-slate-500 hover:text-slate-200 bg-slate-700/40 hover:bg-slate-700 rounded-lg px-2 py-1.5 transition-colors"
            >
              + Losse afspraak
            </button>
          </div>

          {/* Tijdlijn (scrollbaar) */}
          <div className="flex-1 overflow-y-auto border-t border-slate-700/40">
            <div className="px-1 py-0.5">
              <DagKaartTijdlijn
                blokken={[...blokken].sort((a, b) => a.startMinuten - b.startMinuten)}
                onVerwijder={blokId => onVerwijderBlok(datum, blokId)}
              />
            </div>
          </div>
        </div>
      )}

      {toontLos && (
        <LosBlokModal
          datum={datum}
          onOpslaan={blok => { onBlokToevoegen(datum, blok); setToontLos(false); }}
          onSluit={() => setToontLos(false)}
        />
      )}
    </div>
  );
}

// ── Hoofdpagina ───────────────────────────────────────────────
function VolgendeWeekPagina({ templates, onAfspraakToevoegen, onNavigeerNaBevestiging, onTerug }) {
  const volgendeWeekMa = getMaandag(voegDagenToe(new Date(), 7));
  const dagen          = getWeekDagen(volgendeWeekMa);

  const [dagBlokken, setDagBlokken] = useState({});
  const [bevestigd,  setBevestigd]  = useState(false);
  const [aantalToe,  setAantalToe]  = useState(0);

  function voegBlokToe(datum, blok) {
    setDagBlokken(p => ({ ...p, [datum]: [...(p[datum] || []), blok] }));
  }

  function verwijderBlok(datum, blokId) {
    setDagBlokken(p => ({ ...p, [datum]: (p[datum] || []).filter(b => b.id !== blokId) }));
  }

  const totaalBlokken = Object.values(dagBlokken).reduce((s, arr) => s + arr.length, 0);

  function bevestigPlanning() {
    let count = 0;
    for (const [datum, blokken] of Object.entries(dagBlokken)) {
      for (const blok of blokken) {
        onAfspraakToevoegen({
          naam: blok.naam, kleur: blok.kleur, datum,
          startMinuten: blok.startMinuten, duurMinuten: blok.duurMinuten
        });
        count++;
      }
    }
    setAantalToe(count);
    setBevestigd(true);
  }

  if (bevestigd) {
    return (
      <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-8 text-center gap-5">
        <div className="w-16 h-16 bg-green-500/20 rounded-2xl flex items-center justify-center text-3xl">✅</div>
        <div>
          <h2 className="text-xl font-bold">Week ingepland!</h2>
          <p className="text-slate-400 text-sm mt-1">{aantalToe} afspraken weggeschreven naar je kalender.</p>
        </div>
        <button onClick={onNavigeerNaBevestiging}
          className="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 rounded-xl font-semibold transition-colors">
          Naar volgende week →
        </button>
      </div>
    );
  }

  return (
    <div className="h-screen bg-slate-900 text-white flex flex-col overflow-hidden">
      {/* Header */}
      <div className="flex-shrink-0 flex items-center gap-3 px-4 py-3 border-b border-slate-700">
        <button onClick={onTerug} className="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-700 text-slate-400 hover:text-white text-xl transition-colors">‹</button>
        <div className="flex-1 min-w-0">
          <h1 className="text-sm font-bold leading-tight truncate">Plan volgende week</h1>
          <p className="text-[11px] text-slate-500 leading-tight">{weekLabel(volgendeWeekMa)}</p>
        </div>
        {totaalBlokken > 0 && (
          <span className="text-xs text-indigo-300 bg-indigo-900/50 px-2 py-1 rounded-lg flex-shrink-0 font-medium tabular-nums">
            {totaalBlokken} blokken
          </span>
        )}
      </div>

      {/* Dag-kaarten */}
      <div className="flex-1 min-h-0 overflow-hidden">
        {/* Desktop: horizontale rij */}
        <div className="hidden md:flex h-full gap-2 p-3 overflow-x-auto">
          {dagen.map(dag => (
            <DagKaart
              key={datumNaarString(dag)}
              dag={dag}
              blokken={dagBlokken[datumNaarString(dag)] || []}
              templates={templates}
              onBlokToevoegen={voegBlokToe}
              onVerwijderBlok={verwijderBlok}
              inklapbaar={false}
            />
          ))}
        </div>
        {/* Mobiel: verticaal stapelbaar */}
        <div className="flex md:hidden flex-col h-full overflow-y-auto gap-2 p-3">
          {dagen.map(dag => (
            <DagKaart
              key={datumNaarString(dag)}
              dag={dag}
              blokken={dagBlokken[datumNaarString(dag)] || []}
              templates={templates}
              onBlokToevoegen={voegBlokToe}
              onVerwijderBlok={verwijderBlok}
              inklapbaar={true}
            />
          ))}
        </div>
      </div>

      {/* Footer */}
      <div className="flex-shrink-0 px-4 py-3 border-t border-slate-700 bg-slate-900/80 backdrop-blur-sm">
        <button
          onClick={bevestigPlanning}
          disabled={totaalBlokken === 0}
          className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 disabled:opacity-40 disabled:cursor-not-allowed rounded-xl font-semibold text-sm transition-colors"
        >
          {totaalBlokken > 0
            ? `Bevestig planning — ${totaalBlokken} blokken →`
            : 'Voeg blokken toe om de week te bevestigen'}
        </button>
      </div>
    </div>
  );
}

function PlanrApp({ store, onNavigeer, initialDatum, onHerstartOnboarding }) {

  const [huidigeDatum,       setHuidigeDatum]       = useState(() => initialDatum ?? new Date());
  const [mobieleTab,         setMobieleTab]          = useState('kalender');
  const [mobieleDag,         setMobieleDag]          = useState(() => new Date());

  const [toontNieuweAct,     setToontNieuweAct]      = useState(false);
  const [toontNieuweTpl,     setToontNieuweTpl]       = useState(false);
  const [nieuweAfspraak,     setNieuweAfspraak]       = useState(null);
  const [gesAfspraak,        setGesAfspraak]          = useState(null);
  const [tplToepasModal,     setTplToepasModal]       = useState(null);  // { datum }

  const [pendingAct,   setPendingAct] = useState(null);
  const dragAfspraakIdRef            = useRef(null);
  const dragActIdRef                 = useRef(null);

  const maandag = getMaandag(huidigeDatum);

  function slotKlik(datum, startMin) {
    if (pendingAct) {
      store.addAfspraak({ naam:pendingAct.naam, kleur:pendingAct.kleur, datum, startMinuten:clampMinuten(startMin,pendingAct.duurMinuten), duurMinuten:pendingAct.duurMinuten, vasteActiviteitId:pendingAct.id });
      setPendingAct(null);
      return;
    }
    setNieuweAfspraak({ datum, startMinuten: startMin });
  }

  function drop(datum, startMin) {
    if (dragActIdRef.current) {
      const act = store.activiteiten.find(a=>a.id===dragActIdRef.current);
      if (act) store.addAfspraak({ naam:act.naam, kleur:act.kleur, datum, startMinuten:clampMinuten(startMin,act.duurMinuten), duurMinuten:act.duurMinuten, vasteActiviteitId:act.id });
      dragActIdRef.current = null;
    } else if (dragAfspraakIdRef.current) {
      const af = store.afspraken.find(a=>a.id===dragAfspraakIdRef.current);
      if (af) store.updateAfspraak(dragAfspraakIdRef.current, { datum, startMinuten:clampMinuten(startMin,af.duurMinuten) });
      dragAfspraakIdRef.current = null;
    }
  }

  function pasTemplateToe({ template, datum, mode }) {
    if (mode === 'vervangen') {
      store.afspraken.filter(a=>a.datum===datum).forEach(a=>store.removeAfspraak(a.id));
    }
    template.blokken.forEach(blok => {
      if (mode === 'aanvullen') {
        const bestaatAl = store.afspraken.some(a=>a.datum===datum && a.startMinuten===blok.startMinuten && a.naam===blok.naam);
        if (bestaatAl) return;
      }
      store.addAfspraak({ naam:blok.naam, kleur:blok.kleur, datum, startMinuten:clampMinuten(blok.startMinuten,blok.duurMinuten), duurMinuten:blok.duurMinuten });
    });
  }

  function openDagTemplate(datum) {
    setTplToepasModal({ datum });
  }

  return (
    <div className="flex h-screen overflow-hidden bg-slate-900 text-white">

      {/* ── DESKTOP (md+) ── */}
      <div className="hidden md:flex h-full w-full">
        <Sidebar
          activiteiten={store.activiteiten}
          templates={store.templates}
          onNieuwe={()=>setToontNieuweAct(true)}
          onDragStart={(type,id)=>{ if(type==='vasteActiviteit') dragActIdRef.current = id; }}
          onVerwijder={store.removeActiviteit}
          onNieuweTemplate={()=>setToontNieuweTpl(true)}
          onNavigeer={onNavigeer}
        />
        <div className="flex-1 flex flex-col overflow-hidden min-w-0">
          <TopBalk maandag={maandag} onVorige={()=>setHuidigeDatum(d=>voegDagenToe(d,-7))} onVolgende={()=>setHuidigeDatum(d=>voegDagenToe(d,7))} onNavigeer={onNavigeer} onHerstartOnboarding={onHerstartOnboarding} />
          <WeekKalender
            maandag={maandag} afspraken={store.afspraken}
            onSlotKlik={slotKlik} onAfspraakKlik={setGesAfspraak}
            onDrop={drop} onAfspraakDragStart={id=>{ dragAfspraakIdRef.current = id; }}
            onDagHeaderKlik={store.templates.length > 0 ? openDagTemplate : undefined}
          />
        </div>
      </div>

      {/* ── MOBIEL (<md) ── */}
      <div className="flex md:hidden flex-col h-full w-full" style={{paddingTop:'env(safe-area-inset-top,0px)'}}>
        {mobieleTab === 'kalender' && (
          <TopBalk maandag={maandag} onVorige={()=>setHuidigeDatum(d=>voegDagenToe(d,-7))} onVolgende={()=>setHuidigeDatum(d=>voegDagenToe(d,7))} mobieleDag={mobieleDag} onNavigeer={onNavigeer}
            onDagTemplateKlik={store.templates.length > 0 ? openDagTemplate : undefined}
            onHerstartOnboarding={onHerstartOnboarding}
          />
        )}
        <div className="flex-1 min-h-0 overflow-hidden">
          {mobieleTab === 'kalender' && (
            <MobieleKalender
              dag={mobieleDag}
              afspraken={store.afspraken.filter(a=>a.datum===datumNaarString(mobieleDag))}
              pendingActiviteit={pendingAct}
              onSlotKlik={slotKlik} onAfspraakKlik={setGesAfspraak}
              onVorigeDag={()=>setMobieleDag(d=>voegDagenToe(d,-1))}
              onVolgendeDag={()=>setMobieleDag(d=>voegDagenToe(d,1))}
            />
          )}
          {mobieleTab === 'activiteiten' && (
            <ActiviteitenLijst
              activiteiten={store.activiteiten}
              onNieuwe={()=>setToontNieuweAct(true)}
              onVerwijder={store.removeActiviteit}
              pendingId={pendingAct?.id}
              onSelecteer={act=>{
                setPendingAct(prev=>prev?.id===act.id?null:act);
                if (pendingAct?.id !== act.id) setMobieleTab('kalender');
              }}
              isMobiel
            />
          )}
          {mobieleTab === 'templates' && (
            <TemplatesLijst
              templates={store.templates}
              onNieuwe={()=>setToontNieuweTpl(true)}
              onNavigeer={onNavigeer}
            />
          )}
        </div>
        <BottomNav activeTab={mobieleTab} onTabChange={setMobieleTab} />
      </div>

      {/* ── MODALS ── */}
      {toontNieuweAct && (
        <NieuweActiviteitModal onOpslaan={store.addActiviteit} onSluit={()=>setToontNieuweAct(false)} />
      )}
      {toontNieuweTpl && (
        <NieuwTemplateModal
          onOpslaan={d=>{ store.addTemplate(d); setToontNieuweTpl(false); onNavigeer('templates'); }}
          onSluit={()=>setToontNieuweTpl(false)}
        />
      )}
      {nieuweAfspraak && (
        <NieuweAfspraakModal
          datum={nieuweAfspraak.datum} startMinuten={nieuweAfspraak.startMinuten}
          onOpslaan={store.addAfspraak} onSluit={()=>setNieuweAfspraak(null)}
        />
      )}
      {tplToepasModal && (
        <TemplateToepassenModal
          datum={tplToepasModal.datum}
          templates={store.templates}
          bestaandeAfspraken={store.afspraken.filter(a=>a.datum===tplToepasModal.datum)}
          onToepassen={pasTemplateToe}
          onSluit={()=>setTplToepasModal(null)}
        />
      )}
      {gesAfspraak && (
        <AfspraakOptiesModal
          afspraak={gesAfspraak}
          onVerwijder={()=>{ store.removeAfspraak(gesAfspraak.id); setGesAfspraak(null); }}
          onVerplaats={m=>{ store.updateAfspraak(gesAfspraak.id,{startMinuten:m}); }}
          onSluit={()=>setGesAfspraak(null)}
        />
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  ROOT APP — simpele hash-routing + service worker
// ═══════════════════════════════════════════════════════════════

function App() {
  const [pagina,         setPagina]         = useState('kalender');
  const [planrKey,       setPlanrKey]       = useState('default');
  const [startDatum,     setStartDatum]     = useState(null);
  const [toonOnboarding, setToonOnboarding] = useState(() => {
    try { return !localStorage.getItem('planr_onboarding_done'); } catch { return false; }
  });
  const store = usePlanrStore();

  function sluitOnboarding() {
    try { localStorage.setItem('planr_onboarding_done', '1'); } catch {}
    setToonOnboarding(false);
  }

  useEffect(() => {
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }
  }, []);

  let inhoud;
  if (pagina === 'volgende-week') {
    inhoud = (
      <VolgendeWeekPagina
        templates={store.templates}
        onAfspraakToevoegen={store.addAfspraak}
        onNavigeerNaBevestiging={() => {
          setStartDatum(voegDagenToe(new Date(), 7));
          setPlanrKey('post-planning-' + Date.now());
          setPagina('kalender');
        }}
        onTerug={()=>setPagina('kalender')}
      />
    );
  } else if (pagina === 'templates') {
    inhoud = (
      <TemplatesPagina
        templates={store.templates}
        activiteiten={store.activiteiten}
        onToevoegen={store.addTemplate}
        onBijwerken={store.updateTemplate}
        onVerwijderen={store.removeTemplate}
        onTerug={()=>setPagina('kalender')}
      />
    );
  } else {
    inhoud = <PlanrApp key={planrKey} store={store} onNavigeer={setPagina} initialDatum={startDatum} onHerstartOnboarding={()=>setToonOnboarding(true)} />;
  }

  return (
    <>
      {inhoud}
      {toonOnboarding && <Onboarding onVoltooid={sluitOnboarding} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
